[project]
name = "what-broke-this-time"
version = "0.1.0"
description = "Local-first incident investigation for data pipelines."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[build-system]
requires = ["uv_build==0.12.21"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = "src/backend"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "ruff>=0.15,<1",
]
pipeline = [
    "dbt-core>=1.10,<2",
    "dbt-duckdb>=1.10,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
