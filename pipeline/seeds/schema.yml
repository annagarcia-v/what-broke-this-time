version: 2

seeds:
  - name: raw_customers
    description: "Synthetic customers; identifiers preserve their leading zeros."
    config:
      column_types:
        customer_id: varchar
        customer_name: varchar
        country: varchar

  - name: raw_orders
    description: "Synthetic orders; all amounts are integer euro cents."
    config:
      column_types:
        order_id: varchar
        customer_id: varchar
        ordered_at: date
        status: varchar
        amount_cents: bigint
